<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Llama AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-3">
        <h1>Chat with Llama AI</h1>
        <div class="mb-3">
            <label for="user-input" class="form-label">Your message:</label>
            <textarea class="form-control" id="user-input" rows="3"></textarea>
        </div>
        <button type="button" class="btn btn-primary" id="chat-btn">Send</button>
        <div id="chat-response" class="mt-3"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            // Handle chat button click
            $("#chat-btn").click(function() {
                const userInput = $("#user-input").val();
                if (!userInput) {
                    alert("Please enter a message to chat with Llama.");
                    return;
                }

                const apiUrl = "http://127.0.0.1:5000/";
                const payload = {
                    "message": userInput
                };

                $.ajax({
                    url: apiUrl,
                    type: "POST",
                    dataType: "json",
                    contentType: "application/json",
                    data: JSON.stringify(payload),
                    success: function(response) {
                        $("#chat-response").text("Llama 1B: " + response.response);
                    },
                    error: function(error) {
                        $("#chat-response").text("Error: " + error.responseText);
                    }
                });
            });
        });
    </script>
</body>
</html>
